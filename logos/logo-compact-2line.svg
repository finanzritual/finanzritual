<svg viewBox="0 -4 156 84" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Finanzritual Logo, zweizeilige gestapelte Variante: FINANZ-, darunter RITUA, wobei das bestehende blau-grüne L-Zeichen den Buchstaben L von RITUAL bildet">
  <!-- Zeile 1: FINANZ- -->
  <!-- textLength erzwingt exakt dieselbe Breite wie Zeile 2 (Text+Marke zusammen) -->
  <text x="0" y="30" font-family="'Space Grotesk', Arial, sans-serif" font-weight="600" font-size="30"
        textLength="152" lengthAdjust="spacingAndGlyphs" fill="#2454A6">FINANZ-</text>

  <!-- Zeile 2: RITUA + L-Marke (bildet zusammen "RITUAL") -->
  <text x="0" y="74" font-family="'Space Grotesk', Arial, sans-serif" font-weight="600" font-size="30"
        textLength="110" lengthAdjust="spacingAndGlyphs" fill="#2454A6">RITUA</text>
  <g transform="translate(114,42)">
    <path d="M4 0 V29 H40" stroke="#2454A6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M8 24 L16 16 L22 20 L30 8 L37 2" stroke="#1E8E5A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="37" cy="2" r="3.2" fill="#1E8E5A"/>
  </g>
</svg>
