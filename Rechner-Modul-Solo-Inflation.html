<!-- ===== Rechner-Modul: inflation =====
     Automatisch aus rechner-inflation.html extrahiert (V874). Enthaelt NUR das reine
     Rechner-Widget (Eingabefelder + Ergebnisanzeige) und sein
     eigenstaendiges JavaScript -- KEIN umgebender Erklaertext, KEINE
     Links zu anderen Seiten. Verwendet ausschliesslich CSS-Klassen aus
     dem global geladenen style.css (.calc-card/.calc-slider etc.),
     keine eigenen Styles noetig. Einbindbar in jede Seite, die
     style.css und script.js laedt (Erwachsenen- oder Jugendbereich). -->
<div class="calc-card" id="inflationsrechner">
      <div class="calc-inputs">
        <div class="row">
          <label for="inf-amount"><span data-en="Amount today">Betrag heute</span> <span class="val" id="inf-amount-val">10.000 €</span></label>
          <input type="range" id="inf-amount" class="calc-slider" min="100" max="500000" step="100" value="10000">
        </div>
        <div class="row">
          <label for="inf-rate"><span data-en="Inflation rate p.a.">Inflationsrate p.a.</span> <span class="val" id="inf-rate-val">2,5⁠%</span></label>
          <input type="range" id="inf-rate" class="calc-slider" min="0" max="10" step="0.1" value="2.5">
        </div>
        <div class="row">
          <label for="inf-years"><span data-en="Time horizon">Zeitraum</span> <span class="val" id="inf-years-val">20 J.</span></label>
          <input type="range" id="inf-years" class="calc-slider" min="1" max="50" step="1" value="20">
        </div>
        <p class="calc-note" data-en="Simplified example calculation. Assumes a constant inflation rate; real inflation fluctuates from year to year.">Vereinfachte Beispielrechnung. Geht von einer konstanten Inflationsrate aus; reale Inflation schwankt von Jahr zu Jahr.</p>
      </div>

      <div class="calc-result">
        <div class="calc-stat calc-stat--total">
          <span class="label" data-en="Purchasing power in the future">Kaufkraft in der Zukunft</span>
          <span class="big num" id="inf-real-value">–</span>
        </div>
        <div class="calc-stat-row">
          <div class="calc-stat">
            <span class="dot dot-start"></span>
            <span class="label" data-en="Amount today">Betrag heute</span>
            <span class="num" id="inf-out-amount">–</span>
          </div>
          <div class="calc-stat">
            <span class="dot dot-blue"></span>
            <span class="label" data-en="Loss of purchasing power">Kaufkraftverlust</span>
            <span class="num" id="inf-loss">–</span>
          </div>
          <div class="calc-stat">
            <span class="dot dot-green"></span>
            <span class="label" data-en="Needed to keep today's power">Nötig für heutige Kaufkraft</span>
            <span class="num" id="inf-needed">–</span>
          </div>
        </div>
      </div>
<script>
/* ===== Inflationsrechner ===== */
(function(){
  const amountEl = document.getElementById('inf-amount');
  const rateEl   = document.getElementById('inf-rate');
  const yearsEl  = document.getElementById('inf-years');

  const amountVal = document.getElementById('inf-amount-val');
  const rateVal   = document.getElementById('inf-rate-val');
  const yearsVal  = document.getElementById('inf-years-val');

  const realValueEl  = document.getElementById('inf-real-value');
  const outAmountEl  = document.getElementById('inf-out-amount');
  const lossEl       = document.getElementById('inf-loss');
  const neededEl     = document.getElementById('inf-needed');

  function isEn(){ return document.documentElement.getAttribute('lang') === 'en'; }

  function compute(){
    const en = isEn();
    const fmt  = new Intl.NumberFormat(en ? 'en-IE' : 'de-DE', { maximumFractionDigits:0 });
    const fmt1 = new Intl.NumberFormat(en ? 'en-IE' : 'de-DE', { minimumFractionDigits:1, maximumFractionDigits:1 });
    const eur = v => en ? ('€' + fmt.format(v)) : (fmt.format(v) + '\u00A0€');

    const amount = parseFloat(amountEl.value);
    const rate   = parseFloat(rateEl.value) / 100;
    const years  = parseInt(yearsEl.value, 10);

    amountVal.textContent = eur(amount);
    rateVal.textContent   = fmt1.format(parseFloat(rateEl.value)) + '%';
    yearsVal.textContent  = years + (en ? (years === 1 ? ' yr' : ' yrs') : ' J.');

    const factor = Math.pow(1 + rate, years);
    const realValue = amount / factor;
    const needed = amount * factor;
    const loss = amount - realValue;
    const lossPct = (loss / amount) * 100;

    realValueEl.textContent = eur(Math.round(realValue));
    outAmountEl.textContent = eur(Math.round(amount));
    lossEl.textContent = eur(Math.round(loss)) + ' (' + fmt.format(Math.round(lossPct)) + ' %)';
    neededEl.textContent = eur(Math.round(needed));
  }

  [amountEl, rateEl, yearsEl].forEach(el => el.addEventListener('input', compute));
  compute();
  window.frPageRecomputers = window.frPageRecomputers || [];
  window.frPageRecomputers.push(compute);
})();
</script>
