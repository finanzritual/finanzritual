<!-- ===== Rechner-Modul: zinseszins =====
     Automatisch aus rechner-zinseszins.html extrahiert (V874). Enthaelt NUR das reine
     Rechner-Widget (Eingabefelder + Ergebnisanzeige) und sein
     eigenstaendiges JavaScript -- KEIN umgebender Erklaertext, KEINE
     Links zu anderen Seiten. Verwendet ausschliesslich CSS-Klassen aus
     dem global geladenen style.css (.calc-card/.calc-slider etc.),
     keine eigenen Styles noetig. Einbindbar in jede Seite, die
     style.css und script.js laedt (Erwachsenen- oder Jugendbereich). -->
<div class="calc-card" id="zinsrechner">
      <div class="calc-inputs">
        <div class="row">
          <label for="zz-start"><span data-en="Starting capital">Startkapital</span> <span class="val" id="zz-start-val">2.000 €</span></label>
          <input type="range" id="zz-start" class="calc-slider" min="0" max="100000" step="500" value="2000">
        </div>
        <div class="row">
          <label for="zz-rate"><span data-en="Monthly contribution">Monatliche Sparrate</span> <span class="val" id="zz-rate-val">150 €</span></label>
          <input type="range" id="zz-rate" class="calc-slider" min="0" max="2500" step="25" value="150">
        </div>
        <div class="row">
          <label for="zz-return"><span data-en="Interest rate p.a.">Zinssatz p.a.</span> <span class="val" id="zz-return-val">5⁠%</span></label>
          <input type="range" id="zz-return" class="calc-slider" min="0" max="12" step="0.25" value="5">
        </div>
        <div class="row">
          <label for="zz-years"><span data-en="Time horizon">Laufzeit</span> <span class="val" id="zz-years-val">15 J.</span></label>
          <input type="range" id="zz-years" class="calc-slider" min="1" max="40" step="1" value="15">
        </div>
        <p class="calc-note" data-en="Simplified example calculation, not investment advice. Interest is calculated monthly. Real returns fluctuate.">Vereinfachte Beispielrechnung, keine Anlageberatung. Zinsen werden monatlich berechnet. Reale Verläufe schwanken.</p>
      </div>

      <div class="calc-result">
        <div class="calc-stat calc-stat--total">
          <span class="label" data-en="Final amount">Endkapital</span>
          <span class="big num" id="zz-final">–</span>
        </div>
        <div class="calc-stat-row">
          <div class="calc-stat">
            <span class="dot dot-start"></span>
            <span class="label" data-en="Starting capital">Startkapital</span>
            <span class="num" id="zz-out-start">–</span>
          </div>
          <div class="calc-stat">
            <span class="dot dot-blue"></span>
            <span class="label" data-en="Contributions">Einzahlungen</span>
            <span class="num" id="zz-out-contrib">–</span>
          </div>
          <div class="calc-stat">
            <span class="dot dot-green"></span>
            <span class="label" data-en="Interest earned">Zinsertrag</span>
            <span class="num" id="zz-out-interest">–</span>
          </div>
        </div>
      </div>
<script>
/* ===== Zinseszins-Rechner (allgemein) ===== */
(function(){
  const startEl = document.getElementById('zz-start');
  const rateEl  = document.getElementById('zz-rate');
  const retEl   = document.getElementById('zz-return');
  const yearsEl = document.getElementById('zz-years');

  const startVal = document.getElementById('zz-start-val');
  const rateVal  = document.getElementById('zz-rate-val');
  const retVal   = document.getElementById('zz-return-val');
  const yearsVal = document.getElementById('zz-years-val');

  const finalEl    = document.getElementById('zz-final');
  const outStartEl = document.getElementById('zz-out-start');
  const outContribEl = document.getElementById('zz-out-contrib');
  const outInterestEl = document.getElementById('zz-out-interest');

  function isEn(){ return document.documentElement.getAttribute('lang') === 'en'; }

  function compute(){
    const en = isEn();
    const fmt = new Intl.NumberFormat(en ? 'en-IE' : 'de-DE', { maximumFractionDigits:0 });
    const eur = v => en ? ('€' + fmt.format(v)) : (fmt.format(v) + '\u00A0€');

    const start  = parseFloat(startEl.value);
    const monthly = parseFloat(rateEl.value);
    const annRate = parseFloat(retEl.value) / 100;
    const years  = parseInt(yearsEl.value, 10);
    const mRate  = annRate / 12;
    const months = years * 12;

    startVal.textContent = eur(start);
    rateVal.textContent  = eur(monthly);
    retVal.textContent   = retEl.value + '%';
    yearsVal.textContent = years + (en ? (years === 1 ? ' yr' : ' yrs') : ' J.');

    let balance = start;
    for(let i = 0; i < months; i++){
      balance = balance * (1 + mRate) + monthly;
    }
    const contributed = start + monthly * months;
    const interest = balance - contributed;

    finalEl.textContent = eur(Math.round(balance));
    outStartEl.textContent = eur(Math.round(start));
    outContribEl.textContent = eur(Math.round(monthly * months));
    outInterestEl.textContent = eur(Math.round(interest));
  }

  [startEl, rateEl, retEl, yearsEl].forEach(el => el.addEventListener('input', compute));
  compute();
  window.frPageRecomputers = window.frPageRecomputers || [];
  window.frPageRecomputers.push(compute);
})();
</script>
