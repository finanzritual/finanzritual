<svg viewBox="0 0 640 760" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk', Arial, sans-serif">
  <rect width="640" height="760" fill="#F7F8F9"/>

  <!-- Produktkarte-Rahmen -->
  <rect x="24" y="24" width="592" height="712" rx="18" fill="#ffffff" stroke="#E4E6EA" stroke-width="1.5"/>

  <!-- Eyebrow -->
  <text x="320" y="66" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#5B677A">FINANZRITUAL SHOP · PRODUKT-ENTWURF</text>

  <!-- T-Shirt-Silhouette -->
  <g transform="translate(320,270)">
    <path d="
      M -130 -170
      L -70 -195
      C -50 -215 50 -215 70 -195
      L 130 -170
      L 170 -110
      L 120 -75
      L 100 -95
      L 100 190
      C 100 205 -100 205 -100 190
      L -100 -95
      L -120 -75
      L -170 -110
      Z"
      fill="#16233D" stroke="#0D1626" stroke-width="2" stroke-linejoin="round"/>
    <!-- Kragen -->
    <path d="M -50 -197 C -30 -178 30 -178 50 -197 C 32 -207 -32 -207 -50 -197 Z" fill="#0D1626"/>
  </g>

  <!-- Textblock auf der Brust -->
  <g transform="translate(320,255)" text-anchor="middle">
    <text y="-32" font-size="21" font-weight="700" fill="#ffffff" letter-spacing="0.3">MEIN BLOG</text>
    <text y="-2" font-size="21" font-weight="700" fill="#ffffff" letter-spacing="0.3">MEINE STRASSE</text>
    <text y="28" font-size="21" font-weight="700" fill="#ffffff" letter-spacing="0.3">MEIN VIERTEL</text>
  </g>

  <!-- Crossword-Logo darunter (weiße Variante fuer dunklen Stoff) -->
  <g transform="translate(248.4,300) scale(0.62)">
    <g font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff">
      <g>
        <rect x="0"   y="0" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="39"  y="0" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="78"  y="0" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="117" y="0" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="156" y="0" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="195" y="0" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
      </g>
      <text x="18"  y="19" text-anchor="middle" dominant-baseline="central">F</text>
      <text x="57"  y="19" text-anchor="middle" dominant-baseline="central">I</text>
      <text x="96"  y="19" text-anchor="middle" dominant-baseline="central">N</text>
      <text x="135" y="19" text-anchor="middle" dominant-baseline="central">A</text>
      <text x="174" y="19" text-anchor="middle" dominant-baseline="central">N</text>
      <text x="213" y="19" text-anchor="middle" dominant-baseline="central">Z</text>
    </g>
    <rect x="0" y="38" width="231" height="4" fill="#1E8E5A"/>
    <g font-family="'Space Grotesk', Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff">
      <g>
        <rect x="0"   y="44" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="39"  y="44" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="78"  y="44" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="117" y="44" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="156" y="44" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
        <rect x="195" y="44" width="36" height="36" fill="rgba(255,255,255,0.18)"/>
      </g>
      <text x="18"  y="63" text-anchor="middle" dominant-baseline="central">R</text>
      <text x="57"  y="63" text-anchor="middle" dominant-baseline="central">I</text>
      <text x="96"  y="63" text-anchor="middle" dominant-baseline="central">T</text>
      <text x="135" y="63" text-anchor="middle" dominant-baseline="central">U</text>
      <text x="174" y="63" text-anchor="middle" dominant-baseline="central">A</text>
      <text x="213" y="63" text-anchor="middle" dominant-baseline="central">L</text>
    </g>
  </g>

  <!-- Produkt-Notiz-Bereich unten -->
  <line x1="60" y1="600" x2="580" y2="600" stroke="#E4E6EA" stroke-width="1.5"/>
  <text x="60" y="632" font-size="18" font-weight="700" fill="#16233D">„Mein Blog · meine Straße · mein Viertel"</text>
  <text x="60" y="656" font-size="13" fill="#5B677A">Motiv: Kastenschrift-Logo (Crossword-Variante), weiß auf dunklem Stoff</text>
  <text x="60" y="678" font-size="13" fill="#5B677A">Status: Idee festgehalten — Farbe, Schnitt, Druckverfahren noch offen</text>

  <rect x="60" y="700" width="130" height="26" rx="13" fill="#EAF0FA"/>
  <text x="125" y="717" text-anchor="middle" font-size="11" font-weight="700" fill="#2454A6">SHOP · ENTWURF</text>
</svg>
